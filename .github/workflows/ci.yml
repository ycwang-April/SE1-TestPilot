name: offline-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[web,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=testpilot --cov-branch --cov-report=term-missing
        env:
          TESTPILOT_RUN_INTEGRATION: '0'
